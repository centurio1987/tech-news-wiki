# ─────────────────────────── 클러스터 파라미터 ───────────────────────────

[cluster]
sim_link = 0.35            # 두 항목을 같은 클러스터로 잇는 코사인 임계
cohesion_threshold = 0.5   # τ — 이 이상이면 LLM 샘플링 대상(coherent)
member_sim_min = 0.30      # 거리 게이트: centroid 코사인 이 미만 멤버는 대표 샘플에서 제외
sample_k = 1               # 클러스터당 기본 대표 수 (size 클수록 +1, 상한 3)
max_samples = 40           # LLM 에 투입할 대표 총량 상한(컨텍스트 예산)
