[project]
name = "tech-news-wiki"
version = "0.1.0"
description = "테크 뉴스 수집·클러스터링·큐레이션 위키 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# scripts/ 는 실행 스크립트 모음 — 패키지 빌드 대상이 아니다.
[tool.uv]
package = false
