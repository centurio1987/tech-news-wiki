# tech-news-wiki 수집 소스 정의
#
# 각 [[feed]] 항목:
#   name      고유 이름 (중복 불가)
#   url       RSS/Atom 피드 URL  (kind="youtube" 는 channel_id 로 자동 조립되므로 생략 가능)
#   kind      rss | atom | youtube
#   audience  ["dev"], ["po"], ["dev","po"] 중 하나 이상
#   lang      ko | en (참고용)
#   weight    0<w<=10 — 클러스터 대표 선정 tiebreak / 관련도 우선순위 (기본 1.0)
#   trust     0<t<=10 — 데이터 신뢰도 prior (게이트웨이#1). 기본 1.0.
#             회사 공식/1차 소스 1.2, 애그리게이터/재게시 위주 0.9 권장. weight 와 별개.
#
# 검증은 scripts/common.py:load_config 가 수행. 잘못된 항목은 비활성 처리되고 경고만 남는다.

